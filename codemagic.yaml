workflows:
  ios-testflight:
    name: iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic
    environment:
      groups:
        - appstore
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.soumbati.colorclaim"
    scripts:
      - name: Unzip source
        script: |
          rm -rf app-src && mkdir app-src
          unzip -q src.zip -d app-src
      - name: Fetch and create signing files
        script: |
          cd app-src
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --certificate-key "@env:CERTIFICATE_PRIVATE_KEY" --create
      - name: Set up code signing
        script: |
          cd app-src
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles --warn-only
      - name: Get Flutter packages
        script: |
          cd app-src && flutter pub get
      - name: Install pods
        script: |
          cd app-src/ios && pod install
      - name: Build ipa for App Store
        script: |
          cd app-src
          flutter build ipa --release \
            --build-name=1.1.0 \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=$HOME/export_options.plist
    artifacts:
      - app-src/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
